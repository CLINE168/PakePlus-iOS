<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>铁路工务智慧巡检系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- ===================== 登录界面 ===================== -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-box">
    <h1 class="login-title">铁路工务智慧巡检系统</h1>
    <p class="login-sub">Railway Works Intelligent Inspection System</p>
    <div class="login-form">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="loginUser" placeholder="请输入用户名" autocomplete="off">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="loginPass" placeholder="请输入密码">
      </div>
      <div class="form-group">
        <label>验证码</label>
        <div class="captcha-row">
          <input type="text" id="loginCode" placeholder="请输入验证码" maxlength="4">
          <canvas id="captchaCanvas" width="90" height="34" title="点击刷新验证码"></canvas>
        </div>
      </div>
      <div class="login-error" id="loginError"></div>
      <button class="btn btn-primary btn-block" id="loginBtn">登 录</button>
      <p class="login-tip">默认账号：admin / 123456　（也可在“职工信息”中注册职工账号）</p>
    </div>
  </div>
</div>

<!-- ===================== 主界面 ===================== -->
<div id="mainApp" class="main-app hidden">
  <!-- 顶部：系统栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" id="menuToggle" aria-label="菜单">☰</button>
      <span class="logo">🚞</span>
      <span class="sys-name">铁路工务智慧巡检系统 V1.0</span>
    </div>
    <div class="topbar-right">
      <span id="topUser" class="top-user">👤</span>
      <button class="btn btn-light btn-sm" id="logoutBtn">退出登录</button>
    </div>
  </header>

  <div class="layout">
    <!-- 左侧：功能列表区 -->
    <aside class="sidebar" id="sidebar">
      <nav class="menu" id="menu"></nav>
    </aside>
    <div class="sidebar-mask" id="sidebarMask"></div>

    <!-- 右侧：功能操作区 + 信息显示区 -->
    <main class="content">
      <div class="toolbar" id="toolbar"></div>
      <div class="panel" id="panel"></div>
    </main>
  </div>
</div>

<!-- ===================== 通用弹窗 ===================== -->
<div class="modal-mask hidden" id="modalMask">
  <div class="modal" id="modalBox">
    <div class="modal-head">
      <span id="modalTitle">标题</span>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
